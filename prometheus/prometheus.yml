global:
  scrape_interval: 5s
  evaluation_interval: 5s
  # Must be < scrape_interval, otherwise Prometheus clamps it and a slow target
  # can eat the whole interval. cAdvisor is the slow one here (~1.1s for ~60
  # containers); 4s leaves it real headroom while still failing fast enough
  # that a hung exporter shows up as a gap instead of stalling the scrape loop.
  scrape_timeout: 4s
  external_labels:
    stack: "homelab-observability"

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    # node_exporter runs with network_mode: host (required for accurate
    # network-interface metrics — see docker-compose.yml), so it's off the
    # "observability" Docker network and can't be reached by container name.
    # Reachable via the host's Tailscale IP instead, since --web.listen-address
    # is explicitly bound there. Replace with your own tailnet IP if you fork
    # this repo — this one file can't read from .env like docker-compose.yml can.
    static_configs:
      - targets: ["100.77.191.60:9100"]

  - job_name: "nvidia_gpu_exporter"
    static_configs:
      - targets: ["nvidia_gpu_exporter:9835"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
