services:
  prometheus:
    image: prom/prometheus:latest
    container_name: obs-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      # Hard size cap in addition to the time-based retention. The host disk
      # sits at ~94% used, and a cardinality spike (this stack has already seen
      # one: ~9k -> ~127k series in hours, PRD.md §7) makes 15d of raw data an
      # unbounded number of bytes. Whichever limit trips first wins, so this
      # guarantees Prometheus can never be the thing that fills the disk and
      # takes the other ~57 containers down with it.
      - "--storage.tsdb.retention.size=5GB"
      - "--web.enable-lifecycle"
    ports:
      - "${TAILSCALE_IP}:9099:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - observability

  node_exporter:
    image: prom/node-exporter:latest
    container_name: obs-node-exporter
    restart: unless-stopped
    pid: host
    # network_mode: host is required (not optional) for accurate network
    # metrics: /proc/net/dev reflects the *reading process's own* network
    # namespace, not an arbitrary mounted /proc tree — so under normal
    # bridge networking node_exporter only ever sees its own virtual eth0
    # into the Docker bridge, never the host's real wlo1/tailscale0. This
    # was discovered when "Network Throughput" in Grafana showed suspiciously
    # tiny numbers that turned out to be Prometheus's own scrape traffic.
    # Since ports: is ignored under host networking, --web.listen-address
    # below does the job of keeping this bound to the Tailscale IP only.
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./node-exporter-textfile:/textfile_collector:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile_collector"
      - "--web.listen-address=${TAILSCALE_IP}:9100"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://${TAILSCALE_IP}:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

  nvidia_gpu_exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: obs-nvidia-gpu-exporter
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "${TAILSCALE_IP}:9835:9835"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
    networks:
      - observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: obs-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      # disk/diskIO scan per container sangat lambat di mesin ini (94% disk penuh,
      # ~50 container) dan bikin scrape timeout. Metrik disk per-container ga
      # diminta PRD §6 (cuma CPU/Memory/Network I/O/Status), jadi aman dimatikan.
      - "--disable_metrics=disk,diskIO,hugetlb,referenced_memory,resctrl,cpu_topology,sched,tcp,udp,advtcp"
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
    ports:
      # Host 8081 -> container 8080 (host 8080 reserved for the portfolio
      # project's local dev stack, which runs on this same machine).
      - "${TAILSCALE_IP}:8081:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: obs-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${TAILSCALE_IP}:3033:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # 256M was too tight for current Grafana (unified storage / bleve
          # indexing / provisioning API) — it sat pinned at ~99% mem and got
          # OOM-killed on a restart loop, which broke sessions and made the
          # dashboard spin forever ("loading" that never resolves). 512M then
          # turned out to leave little headroom either: a burst of dashboard
          # reloads and API queries during an audit pushed it from 162M to
          # 395M (77% of 512M) within minutes. Since an OOM here takes the
          # whole UI down, and the host has ~14GB free, buy real headroom —
          # and alert before it matters (ObservabilityContainerMemoryHigh).
          cpus: "0.5"
          memory: 768M
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
